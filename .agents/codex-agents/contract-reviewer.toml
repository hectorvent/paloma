name = "contract-reviewer"
description = "Reviews a Paloma diff against the project's user-facing contracts: exit codes, stdout vs stderr, -q primary ids, --dry-run, validation before API calls, secrets, destructive-action confirmation and named limits. Use before a PR, after adding or changing a command, or when asked to \"review this against the conventions\"."
