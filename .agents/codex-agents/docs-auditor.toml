name = "docs-auditor"
description = "Finds drift between what the `paloma` binary actually exposes (`--help`) and what docs/, docs/README.md and README.md say: missing or extra verbs and flags, broken relative links. Use before a release, after command changes, or when asked \"are the docs up to date\"."
