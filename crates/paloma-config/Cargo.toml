[package]
name = "paloma-config"
description = "Configuration, profiles, secret storage and context resolution for paloma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
paloma-core.workspace = true
etcetera.workspace = true
indexmap.workspace = true
keyring-core.workspace = true
secrecy.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
