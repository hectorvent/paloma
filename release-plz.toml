[workspace]
# One version for the whole workspace, tagged as vX.Y.Z on the binary crate.
publish = false
# Nothing goes to crates.io, so versions come from the vX.Y.Z tags, not the registry.
git_only = true
# Tag and release only when a release PR is merged, never on an ordinary push.
release_always = false
git_tag_enable = false
changelog_update = false

[[package]]
name = "paloma-cli"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"
