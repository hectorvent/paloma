[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/hectorvent/paloma"
authors = ["Hector Ventura <hectorvent@gmail.com>"]

[workspace.dependencies]
paloma-core = { path = "crates/paloma-core" }
paloma-config = { path = "crates/paloma-config" }
paloma-graph = { path = "crates/paloma-graph" }
paloma-manifest = { path = "crates/paloma-manifest" }

anstream = "1.0"
anstyle = "1.0"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.2"
comfy-table = { version = "8.0", default-features = false }
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
etcetera = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
humantime = "2.4"
indexmap = { version = "2", features = ["serde"] }
indicatif = "0.18"
keyring-core = "1.0"
mime_guess = "2.0"
percent-encoding = "2.3"
regex = { version = "1.13", default-features = false, features = ["std", "perf"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "multipart", "stream", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_norway = "0.9"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "macros", "time", "fs", "io-util"] }
toml = { version = "1.1", features = ["preserve_order"] }
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

# dev
assert_cmd = "2.2"
insta = { version = "1.49", features = ["json", "yaml"] }
predicates = "3.1"
tempfile = "3.27"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# `cargo build --profile dist` when binary size matters more than raw speed.
[profile.dist]
inherits = "release"
opt-level = "s"
