name: release-plz

# Opens/updates a release PR (version bump + CHANGELOG from Conventional Commits) on every
# push to main; merging it tags the release, which triggers release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        env:
          # A PAT (contents + pull-requests: write): tags pushed with the default
          # GITHUB_TOKEN do not trigger release.yml.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
